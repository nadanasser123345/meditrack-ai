<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediTrack AI - Cardiology{% endblock %}</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 800;
            color: #dc2626 !important;
            letter-spacing: -0.5px;
        }
        .card-custom {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transition: all 0.2s ease-in-out;
        }
        .card-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }
        .badge-heart {
            background-color: #fee2e2;
            color: #dc2626;
            font-weight: 700;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-heart-pulse text-danger fs-3"></i>
                <span>MediTrack AI <span class="badge bg-danger text-white fs-6">Cardio Edition</span></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-home"></i> الرئيسية</a>
                <a href="/doctor" class="btn btn-danger btn-sm"><i class="fa-solid fa-user-doctor"></i> بوابة الطبيب والمسح</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 text-muted border-top mt-5 bg-white">
        <small>MediTrack AI &copy; 2026 - نظام السجل القلبي الذكي المعزز بالذكاء الاصطناعي</small>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
