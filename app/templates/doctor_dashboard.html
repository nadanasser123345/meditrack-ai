{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center py-4">
        <div class="card card-custom p-4 bg-white">
            <i class="fa-solid fa-stethoscope text-danger mb-3" style="font-size: 4rem;"></i>
            <h2 class="fw-bold mb-2">بوابة الطبيب - مسح كود المريض</h2>
            <p class="text-secondary mb-4">
                {{ doctor.user.full_name }} <br>
                <span class="badge bg-secondary-subtle text-dark">{{ doctor.specialty }}</span>
            </p>

            {% if error %}
            <div class="alert alert-danger py-2 mb-3">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
            </div>
            {% endif %}

            <!-- Token Entry Form -->
            <form action="/doctor/access" method="POST" class="mb-4">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">أدخل رمز المشاركة (Token) أو امسح الـ QR:</label>
                    <input type="text" name="token" class="form-control form-control-lg text-center font-monospace" placeholder="الصق رمز الـ Token هنا..." required>
                </div>
                <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">
                    <i class="fa-solid fa-unlock-keyhole me-2"></i> فتح السجل القلبي
                </button>
            </form>

            <div class="border-top pt-3 text-muted small">
                <i class="fa-solid fa-shield-halved text-success me-1"></i> النظام مشفر ولا يتيح استعراض السجلات إلا بموافقة المريض الصريحة وعبر رمز صالح.
            </div>
        </div>
    </div>
</div>
{% endblock %}
